<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>アカウントを選択 · AI Hub</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/account-session.css" />
  </head>
  <body class="login-page">
    <main class="login-layout" aria-labelledby="loginHeading">
      <header class="login-header">
        <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>AI Hub</div>
        <h1 id="loginHeading">アカウントを選択</h1>
        <p class="meta">ローカル検証用</p>
      </header>
      <div class="login-choices">
        <section aria-labelledby="employeeHeading">
          <h2 id="employeeHeading">社員</h2>
          <div id="employeeAccounts" class="login-accounts"></div>
          <p id="employeeLoginStatus" class="login-message" role="status">アカウントを読み込んでいます。</p>
          <button type="button" id="retryAccounts" class="secondary" hidden>社員一覧を再読み込み</button>
        </section>
        <section aria-labelledby="adminHeading">
          <h2 id="adminHeading">管理者</h2>
          <form id="adminLogin" class="login-form" method="post" action="/api/session/login">
            <label class="formlabel">アカウント<input name="account" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required /></label>
            <label class="formlabel">パスワード<input name="password" type="password" autocomplete="current-password" required /></label>
            <button id="adminLoginSubmit" type="submit" class="primary" disabled>管理者としてログイン</button>
            <p id="adminLoginStatus" class="login-message account-error" role="alert"></p>
          </form>
        </section>
      </div>
      <noscript><p>ログインするには JavaScript を有効にしてください。</p></noscript>
    </main>
    <script type="module" src="/account-session.js"></script>
  </body>
</html>
