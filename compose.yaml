name: ai-hub-hermes-local
services:
  sato-receipts:
    extends: {file: infra/compose.receipts.yaml, service: reader}
    environment:
      API_SERVER_KEY: ${SATO_KEY:?run node infra/init.mjs first}
    volumes: ["sato-data:/store:ro"]
    networks: [sato-net]
  tanaka-receipts:
    extends: {file: infra/compose.receipts.yaml, service: reader}
    environment:
      API_SERVER_KEY: ${TANAKA_KEY:?run node infra/init.mjs first}
    volumes: ["tanaka-data:/store:ro"]
    networks: [tanaka-net]
  sato:
    extends: {file: infra/compose.hermes.yaml, service: hermes}
    environment:
      API_SERVER_KEY: ${SATO_KEY:?run node infra/init.mjs first}
    volumes:
      - sato-data:/opt/data
    networks: [sato-net]
  tanaka:
    extends: {file: infra/compose.hermes.yaml, service: hermes}
    environment:
      API_SERVER_KEY: ${TANAKA_KEY:?run node infra/init.mjs first}
    volumes:
      - tanaka-data:/opt/data
    networks: [tanaka-net]
  model: &fixture
    image: python@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b
    user: "65534:65534"
    read_only: true
    command: [python, -B, /fixture/model.py]
    volumes: ["./infra/model.py:/fixture/model.py:ro"]
    networks: [providers]
  model-b:
    <<: *fixture
    environment:
      FIXTURE_MODEL_ID: fixture-model-b
  hub:
    build: {context: ./infra, dockerfile: hub.Dockerfile}
    working_dir: /app
    command: [node, server.mjs]
    depends_on:
      sato: {condition: service_healthy}
      tanaka: {condition: service_healthy}
    environment:
      LISTEN_ADDR: hub-entry
      LOCAL_MLX_ENABLED: ${LOCAL_MLX_ENABLED:-0}
      DATA_DIR: /data
      ADMIN_ACCOUNTS_DIR: /run/secrets/admin-accounts
      SATO_GATEWAY_HOST: hub-sato
      TANAKA_GATEWAY_HOST: hub-tanaka
      SATO_URL: http://sato:8642
      TANAKA_URL: http://tanaka:8642
      SATO_RECEIPTS_URL: http://sato-receipts:8643
      TANAKA_RECEIPTS_URL: http://tanaka-receipts:8643
      SATO_KEY: ${SATO_KEY:?run node infra/init.mjs first}
      TANAKA_KEY: ${TANAKA_KEY:?run node infra/init.mjs first}
      AI_HUB_RUNTIME_ALIASES: ${AI_HUB_RUNTIME_ALIASES-}
      AI_HUB_LOCAL_DIRECTORY_FILE: ${AI_HUB_LOCAL_DIRECTORY_FILE-}
    volumes:
      - ./src:/app/src:ro
      - ${AI_HUB_INQUIRY_DESKS:-./src/inquiries/inquiry-desks.json}:/app/src/inquiries/inquiry-desks.json:ro
      - ${AI_HUB_LIBRARY_DIR:-./library-data}:/app/library-data:ro
      - ./server.mjs:/app/server.mjs:ro
      - ./.runtime/admin-accounts:/run/secrets/admin-accounts:ro
      - ./public:/app/public:ro
      - ./skills:/app/skills:ro
      - hub-data:/data
    networks:
      entry:
        aliases: [hub-entry]
        gw_priority: 1
      sato-net: {aliases: [hub-sato]}
      tanaka-net: {aliases: [hub-tanaka]}
      providers: {}
    ports: ["127.0.0.1:18731:18731", "127.0.0.1:18732:18732", "127.0.0.1:18733:18733"]
networks:
  entry: {}
  providers: {internal: true}
  sato-net: {internal: true}
  tanaka-net: {internal: true}
volumes:
  sato-data: {}
  tanaka-data: {}
  hub-data: {}
